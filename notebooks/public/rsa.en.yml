en:
  next: "Next"
  title: "# Breaking RSA\n\nThis website guides you step by step through the process of breaking RSA encryption.\n\nFirst, we need the public parameters of the encryption. These are $N$ and $e$.\n\n{n_input}</br>{e_input}</br>{button}"
  prime_factors: "## Calculate the prime factorization of $N$\n\nThe first step and also the only step that requires a quantum computer is the prime factorization of $N$. For our example, we have chosen an $N$ that is still small enough that even a classical algorithm can find the prime factors. These are:\n\np = {p}</br>q = {q}</br>{phi_button}"
  phi_function: "## Calculate the Phi function of $N$: $\\varphi(N)$\n\nThe [Euler's totient function](https://en.wikipedia.org/wiki/Euler%27s_totient_function) counts how many numbers between 1 and N are coprime to N. This is important for us because $e$ must be coprime to N and our private key $d$ as well. These numbers have special properties that the RSA algorithm takes advantage of. $\\varphi(N)$ will help us calculate the key $d$ from $e$.\n\nThe formula for $\\varphi(N)$ is very simple to calculate thanks to our prime factorization of $N$:\n\n$\\varphi(N) = (p - 1) \\cdot (q - 1) = {phi}$\n\n{d_button}"
  private_key: "## Calculate the secret key (private key) $d$\n\nSymbolically, the formula for $d$ is given by\n\n$$\nd = e^{{-1}} \\operatorname{{mod}} \\varphi(n).\n$$\n\nWhen you actually want to calculate $d$, you use the [extended Euclidean algorithm](https://en.wikipedia.org/wiki/Extended_Euclidean_algorithm). This gives\n\n$$\nd = {d}\n$$"
  cipher: "## Decrypt the secret message $c$\n\nFor this we first need the message:\n\n{c_input}\n\n{c_button}"
  solution: "The plaintext message is obtained by exponentiation with the secret key $d$ and modular arithmetic with the public parameter $N$. As a formula this is written as:\n\n$$\nm = c^d \\operatorname{{mod}} N\n$$\n\nIn practice, this operation can be performed using the [binary exponentiation algorithm](https://en.wikipedia.org/wiki/Exponentiation_by_squaring#Modular_exponentiation) (also called Square-and-Multiply) and you get:\n\n$$\nm = {m}\n$$"
